<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline · BuildXact Saudi</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #edf0f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 24px; box-sizing: border-box; }
  .box { max-width: 380px; text-align: center; background: #fff; border-radius: 16px; padding: 40px 28px; box-shadow: 0 10px 30px rgba(10, 20, 40, 0.12); }
  .mark { width: 56px; height: 56px; border-radius: 14px; background: #16233f; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; margin: 0 auto 20px; }
  h1 { font-size: 19px; color: #0a1428; margin: 0 0 10px; }
  p { color: #5a6472; font-size: 14.5px; line-height: 1.5; margin: 0 0 22px; }
  button { background: linear-gradient(135deg, #f0932b, #c9720f); color: #fff; border: none; border-radius: 8px; padding: 11px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">BX</div>
    <h1>You're offline</h1>
    <p>This page needs a connection to load. Your device data (projects, invoices, site logs) lives on the server, not on your phone — reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
